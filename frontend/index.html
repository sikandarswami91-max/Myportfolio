  <body class="bg-neutral-50 text-neutral-900 antialiased selection:bg-cyan-500/30 selection:text-cyan-900">
    <div id="root"></div>
    <script>
      // Restore the user's manually saved theme before React hydrates.
      // Default is Light Mode; only apply dark if the user explicitly chose it.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.body.className = 'bg-neutral-950 text-neutral-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200';
        }
      } catch (e) { /* localStorage unavailable */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
